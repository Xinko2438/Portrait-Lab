<h1>Portrait Lab 使用说明</h1>
<p><a href="/">返回工作台</a></p>
<h2>准备参考图</h2>
<p>上传同一人物的清晰照片。风格模板用于说明构图、服装或光影；只有在你拥有相应使用权限时才使用这些素材。</p>
<h2>生成与恢复</h2>
<p>先配置自己的生成渠道。点击开始生成会按当前输入提交任务，实际服务可能消耗额度。任务状态不明时先检测或导入原任务结果，不重复发送。</p>
<h2>评审与修改</h2>
<p>对照原参考图，分别记录人脸一致性、自然度和目标风格。可在图片上添加批注，并以修改版本继续；原图和原记录保持可追溯。</p>
<h2>公开版本</h2>
<p>这是空工作区源码版本，不包含原工作台的私人模板、人物照片和历史结果。评分规则是工作流约束，不代表模型输出质量保证。</p>
</main>
